name: Destroy Infrastructure with terraform

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the word destroy (lowercase, no quotes) to delete ALL infrastructure managed by this project'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# Share the same lock group as the deploy workflow so they never run together.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

jobs:
  terraform:
    name: Terraform destroy
    runs-on: ubuntu-latest

    steps:
      # The job always starts, and fails with a clear message instead of being skipped.
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch (you chose: $REF)."
            exit 1
          fi
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error::Confirmation text must be exactly: destroy"
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy
        run: terraform destroy -input=false -auto-approve