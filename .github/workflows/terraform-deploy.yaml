
name: Deploy Infrastructure with Terraform

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  AWS_DEFAULT_REGION: eu-north-1
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # 3. Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 4. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 5. Check Terraform formatting
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # 6. Initialize Terraform
      - name: Terraform Init
        run: terraform init -input=false

      # 7. Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # 8. Generate Terraform execution plan
      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}

      # 9. Apply the saved Terraform plan
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
